packages:
  - "apps/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  bcrypt: true
  msw: true
  prisma: true
  unrs-resolver: true
# Let pnpm rebuild node_modules non-interactively (Turbo runs scripts without a
# TTY, so the modules-dir purge confirmation would otherwise abort the run).
confirmModulesPurge: false
